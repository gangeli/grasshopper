<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#141a2c" />
<title>Hopper — AR Hide & Seek</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #1d2830; --paper: #fbf8f1; --mint: #5ccf9f; --mint-dark: #2f9a78; --glow: #ffd56a;
    --shadow: 0 6px 24px rgba(0,0,0,.25);
    font: 16px/1.4 ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #141a2c; color: var(--ink); }
  canvas { display: block; }
  button { font: inherit; cursor: pointer; border: 0; }
  #landing {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    padding: 24px 20px calc(26px + env(safe-area-inset-bottom)); box-sizing: border-box; z-index: 5; pointer-events: none;
    background: linear-gradient(180deg, rgba(14,18,30,0) 38%, rgba(14,18,30,.72) 62%, rgba(14,18,30,.94) 100%);
    font-family: "Fredoka", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  }
  #landing > * { pointer-events: auto; }
  /* The sky behind the showcase pet: dusk gradient, a warm spotlight, fireflies. */
  #sky { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
    background:
      radial-gradient(ellipse 55% 38% at 50% 34%, rgba(255,214,140,.22), rgba(255,214,140,0) 70%),
      radial-gradient(ellipse 120% 80% at 50% 0%, #3b3f6e 0%, #252a4a 40%, #141a2c 75%, #0e121e 100%); }
  #sky i { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #ffe39a;
    box-shadow: 0 0 10px 3px rgba(255,214,110,.55); opacity: 0; animation: firefly 9s ease-in-out infinite; }
  @keyframes firefly {
    0% { opacity: 0; transform: translate(0,0) scale(.6); }
    20% { opacity: .9; }
    50% { transform: translate(22px,-38px) scale(1); opacity: .55; }
    80% { opacity: .85; }
    100% { opacity: 0; transform: translate(-14px,-80px) scale(.5); }
  }
  @media (prefers-reduced-motion: reduce) { #sky i { animation: none; opacity: .5; } }
  #landing .brand { text-align: center; margin-bottom: 4px; }
  #landing h1 { margin: 0; font-weight: 700; font-size: clamp(46px, 13vw, 76px); line-height: 1; letter-spacing: 1px;
    background: linear-gradient(180deg, #fff8e8 20%, #ffd56a 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 18px rgba(255,200,90,.25)); }
  #landing .tag { margin: 6px 0 0; color: #e6e9f5; font-size: 18px; font-weight: 500; text-align: center; }
  #landing .steps { list-style: none; display: flex; gap: 8px; margin: 18px 0 20px; padding: 0; flex-wrap: wrap; justify-content: center; max-width: 460px; }
  #landing .steps li { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 16px;
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1); color: #dfe4f2; font-size: 14px; font-weight: 500;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #landing .steps b { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%;
    background: rgba(255,213,106,.18); color: #ffd56a; font-size: 13px; font-weight: 700; }
  #landing .cta { position: relative; padding: 17px 34px; font-size: 19px; font-weight: 600; border-radius: 999px; color: #10261d;
    background: linear-gradient(180deg, #8ff0c3, #4cc995); box-shadow: 0 10px 30px rgba(76,201,149,.45), inset 0 1px 0 rgba(255,255,255,.6);
    animation: breathe 2.8s ease-in-out infinite; font-family: inherit; }
  #landing .cta:active { transform: scale(.97); }
  @keyframes breathe { 50% { box-shadow: 0 10px 42px rgba(76,201,149,.7), inset 0 1px 0 rgba(255,255,255,.6); } }
  @media (prefers-reduced-motion: reduce) { #landing .cta { animation: none; } }
  #landing .alt { margin-top: 14px; background: none; color: #8f98b5; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; padding: 4px 8px; font-family: inherit; }
  #landing small { margin-top: 10px; color: #a3abc4; text-align: center; max-width: 400px; font-size: 13px; line-height: 1.45; }
  .primary { background: var(--mint); color: #0d2a20; padding: 14px 22px; border-radius: 999px; font-weight: 700; box-shadow: var(--shadow); }
  .primary:disabled { background: #9db5ab; color: #33463f; cursor: default; }
  .secondary { background: var(--paper); color: var(--ink); padding: 14px 18px; border-radius: 999px; font-weight: 600; box-shadow: var(--shadow); }
  .chip { background: rgba(251,248,241,.9); color: var(--ink); padding: 6px 12px; border-radius: 999px; font-size: 14px; font-weight: 600; }
  .icon { background: rgba(251,248,241,.9); width: 34px; height: 34px; border-radius: 50%; font-weight: 700; }
  .hud { position: fixed; inset: 0; pointer-events: none; z-index: 2147483000; font-family: inherit; }
  .hud button { pointer-events: auto; }
  .hud-top { position: absolute; top: calc(56px + env(safe-area-inset-top)); left: 16px; right: 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .bubble { max-width: min(520px, calc(100vw - 32px)); background: var(--paper); padding: 10px 16px; border-radius: 18px; box-shadow: var(--shadow);
    opacity: 0; transform: translateY(-8px); transition: opacity .25s, transform .25s; text-align: center; }
  .bubble.show { opacity: 1; transform: none; }
  .status { color: #fff; font-size: 14px; font-weight: 600; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
  .hud-corner { position: absolute; top: calc(12px + env(safe-area-inset-top)); right: 12px; display: flex; gap: 6px; align-items: center; }
  .hud-tools { position: absolute; top: calc(12px + env(safe-area-inset-top)); left: 12px; display: flex; gap: 6px; align-items: center; }
  .alert { max-width: min(520px, calc(100vw - 32px)); background: #b8462f; color: #fff; padding: 8px 14px; border-radius: 14px; font-weight: 700; text-align: center; box-shadow: var(--shadow); }
  .hud-bottom { position: absolute; left: 16px; right: 16px; bottom: calc(22px + env(safe-area-inset-bottom)); display: flex; gap: 10px; justify-content: center; }
  .cover { position: absolute; inset: 0; background: radial-gradient(circle at 50% 40%, #2f3f4a, #10171c 70%); color: var(--paper);
    flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; }
  .cover-title { font-size: 28px; font-weight: 800; }
  .cover-num { font-size: 120px; font-weight: 800; color: var(--glow); line-height: 1.1; }
  .cover-sub { color: #b9c9c4; }
  .card { position: absolute; left: 16px; right: 16px; bottom: calc(90px + env(safe-area-inset-bottom)); margin: 0 auto; max-width: 420px; background: var(--paper);
    border-radius: 22px; padding: 18px; box-shadow: var(--shadow); flex-direction: column; gap: 12px; align-items: center; text-align: center; pointer-events: auto; }
  .card-text { font-size: 18px; font-weight: 700; }
  .place-hint { position: absolute; left: 16px; right: 16px; bottom: calc(110px + env(safe-area-inset-bottom)); text-align: center; color: #fff; font-weight: 700;
    text-shadow: 0 1px 4px rgba(0,0,0,.7); }
  .hud { font-family: "Fredoka", ui-rounded, "SF Pro Rounded", system-ui, sans-serif; }
  /* Activities picker: walk (default), hide & seek (unlocks once the room is mapped), ... */
  .acts { position: absolute; left: 16px; right: 16px; bottom: calc(18px + env(safe-area-inset-bottom)); display: flex; gap: 10px; justify-content: center; pointer-events: none; }
  .hud .act { position: relative; flex: 1 1 0; min-width: 0; max-width: 210px; display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 10px;
    border-radius: 22px; text-align: left; color: #eef1fa; background: rgba(20,26,44,.74); border: 1.5px solid rgba(255,255,255,.12);
    box-shadow: 0 8px 24px rgba(0,0,0,.3); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font-family: inherit;
    transition: background .3s, border-color .3s, transform .15s; -webkit-tap-highlight-color: transparent; }
  .hud .act:active { transform: scale(.96); }
  .act-icon { flex: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; font-size: 21px; background: rgba(255,255,255,.09); }
  .act-text { display: flex; flex-direction: column; min-width: 0; flex: 1; }
  .act-label { font-size: 16px; font-weight: 600; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .act-sub { margin-top: 1px; font-size: 12px; font-weight: 500; line-height: 1.25; color: #aab3cc; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .act-bar { display: block; height: 5px; margin-top: 6px; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; }
  .act-bar i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, #ffd56a, #ffb44d); transition: width .8s ease; }
  .hud .act.active { background: rgba(26,58,52,.8); border-color: rgba(92,207,159,.9); }
  .act.active .act-icon { background: rgba(92,207,159,.28); }
  .act.active .act-sub { color: #a9e6cb; }
  .act.locked .act-icon { color: transparent; text-shadow: 0 0 0 rgba(255,255,255,.55); }
  .act-icon { position: relative; }
  .act.locked .act-icon::after { content: "🔒"; position: absolute; right: -4px; bottom: -3px; font-size: 13px; color: #fff; text-shadow: none; }
  .hud .act.ready { color: #10261d; background: linear-gradient(180deg, #8ff0c3, #4cc995); border-color: rgba(255,255,255,.5);
    box-shadow: 0 10px 30px rgba(76,201,149,.45), inset 0 1px 0 rgba(255,255,255,.6); animation: breathe 2.8s ease-in-out infinite; }
  .act.ready .act-icon { background: rgba(255,255,255,.5); }
  .act.ready .act-sub { color: #1d4a37; font-weight: 600; }
  .act.pop { animation: act-pop .8s cubic-bezier(.2,1.5,.4,1), breathe 2.8s ease-in-out .8s infinite; }
  @keyframes act-pop { 0% { transform: scale(.85); } 45% { transform: scale(1.12); } 100% { transform: scale(1); } }
  .act .spark { position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px; border-radius: 50%; background: #ffe39a; pointer-events: none;
    box-shadow: 0 0 10px 3px rgba(255,214,110,.6); animation: act-spark .9s ease-out forwards; }
  @keyframes act-spark { 0% { transform: translate(0,0) scale(.4); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(1); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .hud .act.ready, .act.pop { animation: none; } .act .spark { display: none; } }
</style>
</head>
<body>
<div id="sky" aria-hidden="true"></div>
<div id="landing">
  <div class="brand">
    <h1>Hopper</h1>
    <p class="tag">a tiny creature that plays hide &amp; seek in your room</p>
  </div>
  <ol class="steps">
    <li><b>1</b>Look around your room</li>
    <li><b>2</b>Cover your eyes, count to ten</li>
    <li><b>3</b>Find where Hopper hid</li>
  </ol>
  <button id="btn-ar" class="cta" style="display:none">Start in AR</button>
  <button id="btn-cam" class="cta" style="display:none">Start with camera</button>
  <button id="btn-sim" class="alt">or play in a virtual room</button>
  <small id="support-note"></small>
</div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
